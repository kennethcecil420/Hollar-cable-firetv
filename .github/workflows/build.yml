name: Build Holler Cable APK
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          ls -la
          for z in *.zip; do [ -f "$z" ] && unzip -oq "$z" -d unpacked; done
          if [ -d unpacked ]; then
            src=$(dirname "$(find unpacked -name settings.gradle | head -1)")
            cp -r "$src"/. .
          fi
          ls -la
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk holler-cable.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          make_latest: "true"
          files: holler-cable.apk
