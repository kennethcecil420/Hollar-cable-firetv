name: Build Holler Cable APK
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ -f holler-cable-firetv.zip ]; then
            unzip -oq holler-cable-firetv.zip -d unpacked
            cp -r unpacked/holler-cable-firetv/. .
          fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - run: gradle :app:assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk holler-cable.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          make_latest: "true"
          files: holler-cable.apk
