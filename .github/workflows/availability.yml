name: Weekly lineup check
on:
  schedule: [ { cron: "17 9 * * 0" } ]   # Sundays, early morning Eastern
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: for z in *.zip; do [ -f "$z" ] && unzip -oq "$z" -d unpacked; done
      - name: Check every title against where-to-watch data
        env: { TMDB_KEY: "${{ secrets.TMDB_KEY }}" }
        run: |
          dir=$(dirname "$(find unpacked -name settings.gradle | head -1)")
          python3 "$dir/tools/check_availability.py" "$dir/app/src/main/assets/index.html" availability.json
      - name: Save results
        run: |
          git config user.name "holler-bot"; git config user.email "holler-bot@users.noreply.github.com"
          git add availability.json
          git diff --cached --quiet || git commit -m "Weekly lineup check $(date +%F)"
          git push
